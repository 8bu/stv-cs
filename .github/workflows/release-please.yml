name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

env:
  PDF: TVKTDGH-KHMT.pdf
  MD: spec/TVKTDGH-KHMT.md

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # The steps below run only when a release was just created.
      - name: Checkout
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v4

      - name: Set up Typst
        if: ${{ steps.release.outputs.release_created }}
        uses: typst-community/setup-typst@v4
        with:
          typst-version: latest

      - name: Compile PDF
        if: ${{ steps.release.outputs.release_created }}
        run: typst compile --root . typst/paper.typ "$PDF"

      - name: Attach PDF + Markdown to the release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.release.outputs.tag_name }}" "$PDF" "$MD" --clobber
